name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            fastapi_app/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes rules, see .flake8)
        run: flake8 fastapi_app task_queue mosaik
      - name: Backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: svelte-check
        run: npm run check
      - name: Build dashboard
        run: npm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
        env:
          DB_PASSWORD: ci
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
          SESSION_SECRET: ci
      - name: Build web image (not pushed)
        run: docker build --file fastapi_app/Dockerfile --tag simaas-web:ci .
      - name: Smoke-test image
        run: |
          docker run --rm simaas-web:ci sh -c 'test "$(id -u)" = 1000 && test -f static/svelte-dist/index.html && python -c "import webapp"'
