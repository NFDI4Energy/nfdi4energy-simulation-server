version: "3"
services:
  web:
    build:
      context: ./fastapi_app
    network_mode: "host"
    environment:
      - RABBITMQ_HOST=localhost
      - REDIS_HOST=localhost
      - RESULTS_DIR=/data/results
      - RESOURCES_DIR=/data/resources
      - DATABASE_URL=postgresql://simserver:***REMOVED_SECRET***@localhost:5433/simserver
      - OIDC_CLIENT_ID=nfdi4energy-simaas_uol_de
      - OIDC_CLIENT_SECRET=***REMOVED_SECRET***
      - OIDC_DISCOVERY_URL=https://regapp.nfdi-aai.de/oidc/realms/nfdi/.well-known/openid-configuration
      - SESSION_SECRET=***REMOVED_SECRET***
    depends_on:
      - redis
      - rabbitmq
      - db
    volumes:
      - ./data:/data
      - ./certs:/certs:ro

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=simserver
      - POSTGRES_PASSWORD=***REMOVED_SECRET***
      - POSTGRES_DB=simserver
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sim_network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - sim_network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - sim_network

  example_worker:
    build:
      context: ./task_queue
    environment:
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - RESULTS_DIR=/data/results
      - RESOURCES_DIR=/data/resources
    depends_on:
      - redis
      - rabbitmq
    volumes:
      - ./data:/data
    networks:
      - sim_network

networks:
  sim_network:

volumes:
  pgdata:
