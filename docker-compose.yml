version: "3"
services:
  web:
    build:
      context: .
      dockerfile: fastapi_app/Dockerfile
    ports: ["127.0.0.1:5001:5001", "127.0.0.1:8002:5001"]
    networks: [sim_network]
    command: ["uvicorn", "webapp:app", "--host", "0.0.0.0", "--port", "5001", "--proxy-headers", "--ssl-keyfile", "/certs/key.pem", "--ssl-certfile", "/certs/cert.pem"]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - RESULTS_DIR=/data/results
      - RESOURCES_DIR=/data/resources
      - DATABASE_URL=postgresql://simserver:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/simserver
      - MOSAIK_GUI_URL=http://mosaik-gui
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      - OIDC_DISCOVERY_URL=https://regapp.nfdi-aai.de/oidc/realms/nfdi/.well-known/openid-configuration
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - MOSAIK_ENABLED=${MOSAIK_ENABLED:-true}
    depends_on:
      - redis
      - rabbitmq
      - db
    volumes:
      - ./data/resources:/data/resources
      - ./data/results:/data/results
      - ./certs:/certs:ro

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=simserver
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_DB=simserver
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sim_network

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - sim_network

  redis:
    image: redis:7
    networks:
      - sim_network

  example_worker:
    profiles: ["example"]
    build:
      context: ./task_queue
    environment:
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - RESULTS_DIR=/data/results
      - RESOURCES_DIR=/data/resources
    depends_on:
      - redis
      - rabbitmq
    volumes:
      - ./data/resources:/data/resources:ro
      - ./data/results:/data/results
    networks:
      - sim_network

  mosaik-orbit:
    image: ${MOSAIK_ORBIT_IMAGE:-registry.gitlab.com/mosaik/mosaik-gui/mosaik-orbit:nfdi4energy-simaas}
    environment:
      MOSAIK_ORBIT_HOST: "0.0.0.0"
      MOSAIK_ORBIT_PORT: "8442"
    expose: ["8442"]
    networks: [sim_network]

  mosaik-gui:
    image: registry.gitlab.com/mosaik/mosaik-gui/frontend:nfdi4energy-simaas
    expose: ["80"]
    environment:
      MOSAIK_ORBIT_PROXY_HOST: mosaik-orbit
      MOSAIK_ORBIT_PORT: "8442"
    depends_on: [mosaik-orbit]
    networks: [sim_network]

  mosaik-worker:
    profiles: ["kubernetes-worker"]
    build:
      context: ./mosaik/mosaik-worker
    image: simaas-mosaik-worker:latest
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      MOSAIK_QUEUE: mosaik_requests
      MOSAIK_WS_URL: ws://mosaik-orbit:8442
      RESULTS_DIR: /data/results
      RESOURCES_DIR: /data/resources
    volumes: ["./data/results:/data/results"]
    depends_on: [rabbitmq, redis, mosaik-orbit]
    networks: [sim_network]

networks:
  sim_network:

volumes:
  pgdata:
