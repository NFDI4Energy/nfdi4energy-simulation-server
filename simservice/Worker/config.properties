# Kafka Configuration (can be overridden by environment variables)
# Use service names for containerized environments
kafkaBroker=broker.kafka.svc.cluster.local:9092
schemaRegistry=http://schema-registry.kafka.svc.cluster.local:8081

# Logging Configuration
# Logs are written to the shared volume
logDir=/data/logs

# Definition and Resource Directories
# All paths point to the shared volume mounted at /data
definitionDirectory=/data/definitions
rootDir=/data
resourceDir=/data/resources

# Results directory for simulation outputs
resultsDir=/data/results

# Scenarios directory
scenariosDir=/data/scenarios

# Kubernetes Configuration (always enabled)
kubernetesNamespace=simservice
containerRegistry=simservice
containerImageTag=latest

# Topic Names
channelOrchestration=orchestration.simulation
channelInteraction=interaction.simulation
channelProvision=provision.simulation

topicScenario=scenario
topicResult=result
topicResource=resource
topicSyncMsg=sync
topicStatusMsg=status
topicCtrlMsg=ctrl

# Request Settings
requestMaxAge=16892371447030

# RabbitMQ Configuration (can be overridden by RABBITMQ_HOST env var)
rabbitmqHost=rabbitmq

# Redis Configuration (can be overridden by REDIS_HOST env var)
redisHost=redis